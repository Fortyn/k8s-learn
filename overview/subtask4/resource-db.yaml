apiVersion: v1
kind: Service
metadata:
  name: resource-db-service
  labels:
    app: resource-db
  namespace: k8s-program
spec:
  type: ClusterIP
  ports:
    - port: 5432
      protocol: TCP
  selector:
    app: resource-db
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: resource-db
  namespace: k8s-program
spec:
  selector:
    matchLabels:
      app: resource-db # has to match .spec.template.metadata.labels
  serviceName: "resource-db-service"
  replicas: 1 # by default is 1
  minReadySeconds: 10 # by default is 0
  template:
    metadata:
      labels:
        app: resource-db # has to match .spec.selector.matchLabels
    spec:
      terminationGracePeriodSeconds: 10
      containers:
        - name: resource-db
          image: postgres:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              protocol: TCP
          volumeMounts:
            - name: resource-db-volume-claim
              mountPath: /var/lib/postgresql
          env:
            - value: postgres
              name: POSTGRES_PASSWORD
  volumeClaimTemplates:
    - metadata:
        name: resource-db-volume-claim
      spec:
        accessModes: [ "ReadWriteOnce" ]
        storageClassName: standard
        resources:
          requests:
            storage: 1Gi